<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Feedback loops with agents and a big spec</title>
  <rect width="720" height="560" fill="#ffffff"/>
  <line x1="100" y1="510" x2="690" y2="510" stroke="#555" stroke-width="2"/>
  <path d="M690,504 L702,510 L690,516 z" fill="#555"/>
  <text x="700" y="532" font-size="12" fill="#555" text-anchor="end">time</text>
  <circle cx="400" cy="264" r="246" fill="none" stroke="#c27c0e" stroke-width="3"/>
  <path d="M147,270 L154,256 L161,270 z" fill="#c27c0e"/>
  <circle cx="400" cy="296" r="214" fill="none" stroke="#1f7a6d" stroke-width="3"/>
  <path d="M179,302 L186,288 L193,302 z" fill="#1f7a6d"/>
  <circle cx="400" cy="328" r="182" fill="none" stroke="#a0a0a0" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M211,334 L218,320 L225,334 z" fill="#a0a0a0"/>
  <circle cx="400" cy="360" r="150" fill="none" stroke="#1f7a6d" stroke-width="3"/>
  <path d="M243,366 L250,352 L257,366 z" fill="#1f7a6d"/>
  <circle cx="400" cy="392" r="118" fill="none" stroke="#a0a0a0" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M275,398 L282,384 L289,398 z" fill="#a0a0a0"/>
  <circle cx="400" cy="424" r="86" fill="none" stroke="#1f7a6d" stroke-width="3"/>
  <path d="M307,430 L314,416 L321,430 z" fill="#1f7a6d"/>
  <circle cx="400" cy="456" r="54" fill="none" stroke="#1f7a6d" stroke-width="3"/>
  <path d="M339,462 L346,448 L353,462 z" fill="#1f7a6d"/>
  <g text-anchor="middle" fill="#1f7a6d"><text x="400" y="446" font-size="12" font-weight="600">Agent</text><text x="400" y="460" font-size="12" font-weight="600">iteration</text><text x="400" y="475" font-size="11">seconds</text></g>
  <g text-anchor="middle" fill="#1f7a6d"><text x="400" y="357" font-size="12" font-weight="600">Generated tests</text><text x="400" y="371" font-size="11">minutes</text></g>
  <g text-anchor="middle" fill="#a0a0a0"><text x="400" y="293" font-size="12" font-weight="600">Pair negotiation</text><text x="400" y="307" font-size="11">skipped</text></g>
  <g text-anchor="middle" fill="#1f7a6d"><text x="400" y="229" font-size="12" font-weight="600">Stand-up</text><text x="400" y="243" font-size="11">one day</text></g>
  <g text-anchor="middle" fill="#a0a0a0"><text x="400" y="165" font-size="12" font-weight="600">Acceptance tests</text><text x="400" y="179" font-size="11">skipped</text></g>
  <g text-anchor="middle" fill="#1f7a6d"><text x="400" y="101" font-size="12" font-weight="600">Spec review</text><text x="400" y="115" font-size="11">once</text></g>
  <g text-anchor="middle" fill="#c27c0e"><text x="400" y="37" font-size="12" font-weight="600">Customer sees it</text><text x="400" y="51" font-size="11">months</text></g>
  <circle cx="400" cy="510" r="5" fill="#333"/>
