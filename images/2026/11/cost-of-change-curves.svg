<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Cost of change: the traditional curve, XP's flattened curve, and agents without the conversation</title>
  <rect width="720" height="440" fill="#ffffff"/>

  <!-- axes -->
  <line x1="90" y1="350" x2="680" y2="350" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="350" x2="90" y2="40" stroke="#333" stroke-width="1.5"/>
  <polygon points="680,345 690,350 680,355" fill="#333"/>
  <polygon points="85,40 90,30 95,40" fill="#333"/>

  <!-- x ticks -->
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="120" y="372">Same day</text>
    <text x="300" y="372">Same iteration</text>
    <text x="480" y="372">Release</text>
    <text x="640" y="372">Months later</text>
  </g>
  <text x="385" y="405" font-size="14" fill="#333" text-anchor="middle">How late the mistake is found</text>
  <text x="40" y="195" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 40 195)">Cost of fixing it</text>

  <!-- curves -->
  <path d="M95,335 C 360,330 520,260 670,60" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M95,332 C 300,326 500,316 670,296" fill="none" stroke="#1f7a6d" stroke-width="3.5"/>
  <path d="M95,345 C 400,344 560,300 670,45" fill="none" stroke="#c0392b" stroke-width="3.5"/>

  <!-- legend -->
  <g font-size="14" fill="#333">
    <line x1="120" y1="62" x2="160" y2="62" stroke="#9a9a9a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="170" y="67">The traditional curve</text>
    <line x1="120" y1="90" x2="160" y2="90" stroke="#1f7a6d" stroke-width="3.5"/>
    <text x="170" y="95">XP's promise, with the customer in the room</text>
    <line x1="120" y1="118" x2="160" y2="118" stroke="#c0392b" stroke-width="3.5"/>
    <text x="170" y="123">Agents, without the conversation</text>
  </g>

  <text x="690" y="430" font-size="11" fill="#888" text-anchor="end">Illustrative, not data</text>
</svg>
