<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" width="1500" height="1120" font-family="Georgia, 'Source Serif 4', serif" role="img" aria-labelledby="t d">
<title id="t">A map of the confidences</title>
<desc id="d">Four concentric rings: the change, the system, the team and the customer. Each confidence sits on the ring for what it protects. All the rings apply at once; none comes first.</desc>
<rect width="1500" height="1120" fill="#fff"/>
<circle cx="750" cy="555" r="125" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="750" cy="555" r="245" fill="none" stroke="#222" stroke-width="1.1" stroke-dasharray="6 5"/>
<circle cx="750" cy="555" r="365" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="750" cy="555" r="480" fill="none" stroke="#222" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="750" y="437" text-anchor="middle" font-size="17" letter-spacing="3" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">THE CHANGE</text>
<text x="750" y="317" text-anchor="middle" font-size="17" letter-spacing="3" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">THE SYSTEM</text>
<text x="750" y="197" text-anchor="middle" font-size="17" letter-spacing="3" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">THE TEAM</text>
<text x="750" y="82" text-anchor="middle" font-size="17" letter-spacing="3" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">THE CUSTOMER</text>
<circle cx="632.5" cy="512.2" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="616.5" y="505.2" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">I can change this</text>
<text x="616.5" y="531.2" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">without fear</text>
<circle cx="870.7" cy="522.6" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="886.7" y="515.6" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">I can hold a whole</text>
<text x="886.7" y="541.6" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">change in my head</text>
<circle cx="528.0" cy="451.5" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="512.0" y="444.5" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">Nothing I do reaches</text>
<text x="512.0" y="470.5" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">production by accident</text>
<circle cx="962.2" cy="677.5" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="978.2" y="670.5" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">I can spin up the whole</text>
<text x="978.2" y="696.5" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">system in minutes</text>
<circle cx="646.5" cy="777.0" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="630.5" y="770.0" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">If I'm wrong, I can</text>
<text x="630.5" y="796.0" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">undo it in minutes</text>
<circle cx="865.0" cy="771.3" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="881.0" y="764.3" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">Whatever I finish today</text>
<text x="881.0" y="790.3" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">can go live today</text>
<circle cx="386.4" cy="586.8" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="370.4" y="579.8" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">We all know why</text>
<text x="370.4" y="605.8" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">it works this way</text>
<circle cx="1080.8" cy="400.7" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="1096.8" y="393.7" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">I can say when</text>
<text x="1096.8" y="419.7" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">something's wrong</text>
<circle cx="613.3" cy="893.4" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="597.3" y="886.4" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">We'll be better next week</text>
<text x="597.3" y="912.4" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">than we were last week</text>
<circle cx="428.8" cy="198.3" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="412.8" y="191.3" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">If we're off track,</text>
<text x="412.8" y="217.3" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">we'll find out fast</text>
<text x="750.0" y="1098" text-anchor="middle" font-size="17" fill="#5D738D" font-style="italic">Each confidence sits on the ring it protects. All of them apply at once; none of them comes first.</text></svg>