<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260" font-family="Georgia, 'Source Serif 4', serif" role="img" aria-labelledby="t d">
<title id="t">How far you can hand work to agents</title>
<desc id="d">Five concentric rings of agentic engineering: autocomplete, an agent in the IDE, an agent that runs your tools, agents in the background, and agents in the cloud. Each confidence sits on the ring where agents start to depend on it.</desc>
<rect width="1600" height="1260" fill="#fff"/>
<circle cx="800" cy="620" r="95" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="800" cy="620" r="205" fill="none" stroke="#222" stroke-width="1.1" stroke-dasharray="6 5"/>
<circle cx="800" cy="620" r="315" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="800" cy="620" r="425" fill="none" stroke="#222" stroke-width="1.1" stroke-dasharray="6 5"/>
<circle cx="800" cy="620" r="535" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="800" y="628" text-anchor="middle" font-size="19" fill="#5D738D" font-style="italic">start here</text>
<text x="800" y="532" text-anchor="middle" font-size="16" letter-spacing="2.5" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">AUTOCOMPLETE</text>
<text x="800" y="422" text-anchor="middle" font-size="16" letter-spacing="2.5" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">AN AGENT IN THE IDE</text>
<text x="800" y="312" text-anchor="middle" font-size="16" letter-spacing="2.5" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">AN AGENT THAT RUNS YOUR TOOLS</text>
<text x="800" y="202" text-anchor="middle" font-size="16" letter-spacing="2.5" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">AGENTS IN THE BACKGROUND</text>
<text x="800" y="92" text-anchor="middle" font-size="16" letter-spacing="2.5" fill="#5D738D" stroke="#fff" stroke-width="10" paint-order="stroke" font-family="Helvetica, Arial, sans-serif">AGENTS IN THE CLOUD</text>
<circle cx="607.4" cy="549.9" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="591.4" y="542.9" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">I can hold a whole</text>
<text x="591.4" y="568.9" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">change in my head</text>
<circle cx="992.6" cy="549.9" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="1008.6" y="542.9" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">We all know why</text>
<text x="1008.6" y="568.9" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">it works this way</text>
<circle cx="764.4" cy="821.9" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="748.4" y="814.9" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">I can say when</text>
<text x="748.4" y="840.9" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">something's wrong</text>
<circle cx="542.0" cy="439.3" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="526.0" y="432.3" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">I can change this</text>
<text x="526.0" y="458.3" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">without fear</text>
<circle cx="1072.8" cy="777.5" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="1088.8" y="770.5" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">Nothing I do reaches</text>
<text x="1088.8" y="796.5" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">production by accident</text>
<circle cx="389.5" cy="730.0" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="373.5" y="723.0" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">Whatever I finish today</text>
<text x="373.5" y="749.0" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">can go live today</text>
<circle cx="1168.1" cy="407.5" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="1184.1" y="400.5" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">I can spin up the whole</text>
<text x="1184.1" y="426.5" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">system in minutes</text>
<circle cx="1012.5" cy="988.1" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="1028.5" y="981.1" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">We'll be better next week</text>
<text x="1028.5" y="1007.1" text-anchor="start" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">than we were last week</text>
<circle cx="402.4" cy="262.0" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="386.4" y="255.0" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">If I'm wrong, I can</text>
<text x="386.4" y="281.0" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">undo it in minutes</text>
<circle cx="470.6" cy="1041.6" r="8" fill="#ba3925" stroke="#fff" stroke-width="3"/>
<text x="454.6" y="1034.6" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">If we're off track,</text>
<text x="454.6" y="1060.6" text-anchor="end" font-size="21" fill="#222" stroke="#fff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">we'll find out fast</text>
<text x="800.0" y="1238" text-anchor="middle" font-size="17" fill="#5D738D" font-style="italic">Each confidence sits on the ring where agents start to depend on it. The further out you go, the more of them you need behind you.</text></svg>